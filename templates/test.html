<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>График</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header class="header">
    <a href="{{ url_for('main') }}" class="logo">
        Flask<span>Site</span>
    </a>

    <nav>
        <a href="{{ url_for('main') }}">Главная</a>
        <a href="{{ url_for('about') }}">О нас</a>
        <a href="{{ url_for('chart') }}">График</a>
    </nav>
</header>


    <main>

        <section class="hero">

            <div class="hero-content">

                <p class="subtitle">Тестовая страница</p>

                <h1>
                    Мой первый
                    <span>график</span>
                </h1>

                <p class="description">
                    Этот график полностью создаётся Python
                    и передаётся браузеру через Flask.
                </p>

            </div>

        </section>


        <section class="chart-container">

            <div class="card chart-card">

                <h2>Продажи за неделю</h2>

                <img
                    src="{{ url_for('chart') }}"
                    alt="График продаж"
                >

            </div>

        </section>

    </main>


    <footer>
        <p>Создано с помощью Python + Flask</p>
    </footer>

</body>
</html>
