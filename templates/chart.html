<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>График — FlaskSite</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header class="header">
        <a href="{{ url_for('main') }}" class="logo">
            Flask<span>Site</span>
        </a>

        <nav>
            <a href="{{ url_for('main') }}">Главная</a>
            <a href="{{ url_for('about') }}">О нас</a>
            <a href="{{ url_for('chart') }}">График</a>
        </nav>
    </header>

    <main class="page-content">

        <section class="content-container">

            <p class="subtitle">Визуализация данных</p>

            <h1 class="page-heading">График продаж</h1>

            <p class="page-description">
                Графическое представление данных за неделю.
            </p>

            <div class="chart-container">
                <div class="card chart-card">
                    {{ graph | safe }}
                </div>
            </div>

            <div class="buttons">
                <a href="{{ url_for('main') }}"
                   class="button secondary">
                    На главную
                </a>
            </div>

        </section>

    </main>

    <footer>
        <p>Создано с помощью Python + Flask</p>
    </footer>

</body>
</html>
